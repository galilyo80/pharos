<svg width="520" height="200" viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="520" height="200" rx="28" fill="#05070F"/>
  <!-- light beams -->
  <polygon points="100,70 260,30 260,58 100,80" fill="url(#beam)"/>
  <polygon points="100,78 260,78 260,98 100,86" fill="url(#beam)" opacity="0.5"/>
  <polygon points="100,88 260,126 260,98 100,80" fill="url(#beam)"/>
  <!-- glow -->
  <circle cx="100" cy="78" r="34" fill="url(#glow)" opacity="0.8"/>
  <!-- lighthouse tower -->
  <g>
    <path d="M88 150 L92 96 L108 96 L112 150 Z" fill="url(#tower)"/>
    <rect x="90" y="108" width="20" height="6" fill="#05070F" opacity="0.6"/>
    <rect x="89" y="124" width="22" height="6" fill="#05070F" opacity="0.6"/>
    <!-- lantern room -->
    <rect x="90" y="82" width="20" height="16" rx="3" fill="#EAF1FF"/>
    <circle cx="100" cy="90" r="5" fill="#38BDF8"/>
    <!-- roof -->
    <path d="M86 82 L100 68 L114 82 Z" fill="#2DD4BF"/>
    <!-- base -->
    <rect x="82" y="150" width="36" height="8" rx="3" fill="#2DD4BF"/>
  </g>
  <!-- wordmark -->
  <text x="150" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="7" fill="#EAF1FF">PHAROS</text>
  <text x="152" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="7" fill="#38BDF8">E V   I N T E L L I G E N C E</text>
</svg>
